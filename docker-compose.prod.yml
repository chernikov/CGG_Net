services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cgg_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1443:1433"
    volumes:
      - cgg_sqlserver_data:/var/opt/mssql
    networks:
      - cgg_network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # .NET Backend API
  api:
    image: ${DOCKERHUB_USERNAME}/cgg-api:latest
    container_name: cgg_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=CareerGuidanceGuild;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=CareerGuidanceGuild
      - JwtSettings__Audience=CareerGuidanceGuild-Users
      - JwtSettings__ExpirationInMinutes=1440
      - Cors__AllowedOrigins__0=${CORS_ORIGIN}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - Email__SmtpHost=${EMAIL_SMTP_HOST}
      - Email__SmtpPort=${EMAIL_SMTP_PORT}
      - Email__Username=${EMAIL_USERNAME}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__FromEmail=${EMAIL_FROM}
      - Email__FromName=${EMAIL_FROM_NAME}
      - Monobank__Token=${MONOBANK_TOKEN}
      - Monobank__WebhookUrl=${MONOBANK_WEBHOOK_URL}
      - Monobank__ReturnUrl=${MONOBANK_RETURN_URL}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cgg_network
    restart: always

  # Angular Frontend
  web:
    image: ${DOCKERHUB_USERNAME}/cgg-web:latest
    container_name: cgg_web
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - cgg_network
    restart: always

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: cgg_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - cgg_network
    restart: always

volumes:
  cgg_sqlserver_data:
    driver: local

networks:
  cgg_network:
    driver: bridge
