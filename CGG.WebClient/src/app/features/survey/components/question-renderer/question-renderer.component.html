<div class="bg-white rounded-2xl shadow-md p-6 md:p-8 flex flex-col gap-5">
  <!-- Question text -->
  <h3 class="text-lg md:text-xl font-semibold text-slate-800 leading-snug">
    {{ questionText }}
  </h3>

  <!-- Type-specific input -->
  @switch (question.type) {
    @case ('single-choice') {
      <app-single-choice-question
        [question]="question"
        [value]="value"
        (valueChange)="onChange($event)"
      />
    }
    @case ('multiple-choice') {
      <app-multiple-choice-question
        [question]="question"
        [value]="value"
        (valueChange)="onChange($event)"
      />
    }
    @case ('textarea') {
      <app-textarea-question
        [value]="value"
        [placeholder]="placeholder"
        (valueChange)="onChange($event)"
      />
    }
    @case ('scale') {
      <app-scale-question
        [value]="value"
        [min]="question.min ?? 1"
        [max]="question.max ?? 10"
        (valueChange)="onChange($event)"
      />
    }
    @case ('rating') {
      <app-rating-question
        [value]="value"
        (valueChange)="onChange($event)"
      />
    }
    @default {
      <!-- text, email, number -->
      <app-text-question
        [value]="value"
        [placeholder]="placeholder"
        (valueChange)="onChange($event)"
      />
    }
  }
</div>
