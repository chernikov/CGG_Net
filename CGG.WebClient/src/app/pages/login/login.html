<div class="login-page">
  <div class="login-container">
    <button class="back-button" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M9.195 18.44c1.25.713 2.805-.19 2.805-1.629v-2.34l6.945 3.968c1.25.714 2.805-.188 2.805-1.628V8.688c0-1.44-1.555-2.342-2.805-1.628L12 11.03v-2.34c0-1.44-1.555-2.343-2.805-1.629l-7.108 4.062c-1.26.72-1.26 2.536 0 3.256l7.108 4.061z" />
      </svg>
      Назад
    </button>

    <div class="login-icon">
      <img src="assets/images/register_icon.png" alt="Sign In" />
    </div>

    <h1 class="login-title">Вхід</h1>
    <p class="login-subtitle">Увійдіть до свого облікового запису</p>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="formData.email"
          name="email"
          required
          placeholder="your@email.com"
        >
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="formData.password"
          name="password"
          required
          placeholder="Введіть ваш пароль"
        >
      </div>

      <div class="forgot-password">
        <a [routerLink]="['/forgot-password']">Забули пароль?</a>
      </div>

      <button type="submit" class="submit-button">
        Увійти
      </button>
    </form>

    <div class="register-link">
      <span>Немає облікового запису?</span>
      <a [routerLink]="['/landing']">Зареєструватися</a>
    </div>
  </div>
</div>
