<header class="app-header">
  <button class="menu-button" aria-label="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M3 6.75A.75.75 0 013.75 6h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 6.75z" />
      <path d="M3 12a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 12z" />
      <path d="M3 17.25a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75a.75.75 0 01-.75-.75z" />
    </svg>
  </button>

  <div class="logo" (click)="navigateToLanding()">
    <img class="logo-image" src="assets/images/logo.png" alt="Carreer Guidance guild logo">
  </div>

  @if (isAuthenticated$ | async) {
    <button class="auth-button" (click)="logout()">
      <img src="assets/icons/logout.svg" alt="Вихід" />
    </button>
  } @else {
    <button class="auth-button" (click)="navigateToLogin()">
      <img src="assets/icons/login.svg" alt="Увійти" />
    </button>
  }
</header>
